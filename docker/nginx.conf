server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints everything under /assets with a content hash, so these files
    # can be cached forever; a new build produces new file names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html names the current hashed assets, so it must never be cached, or
    # visitors keep loading an old build after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vue Router uses history mode: any path that isn't a real file (/login,
    # /workspaces/3/...) must serve the app shell and let the router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
