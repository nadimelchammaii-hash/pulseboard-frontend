name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A newer push to the same branch/PR makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Same Node major as the Docker image (node:22-alpine).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # `npm run build` runs vue-tsc (type-check) and `vite build` together, so this
      # one step covers both type errors and bundling failures.
      - name: Type-check and build
        run: npm run build

  # Proves the Dockerfile still builds and the image can run Vite, so a broken image
  # is caught on the PR rather than at the next `docker compose build`. Nothing is
  # pushed anywhere.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pulseboard-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: docker run --rm pulseboard-frontend:ci npx vite --version
