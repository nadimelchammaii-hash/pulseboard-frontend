name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A newer push to the same branch/PR makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Same Node major as the Docker image (node:22-alpine).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # `npm run build` runs vue-tsc (type-check) and `vite build` together, so this
      # one step covers both type errors and bundling failures.
      - name: Type-check and build
        run: npm run build

  # Proves the Dockerfile still builds and the image can run Vite, so a broken image
  # is caught on the PR rather than at the next `docker compose build`. Nothing is
  # pushed anywhere.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pulseboard-frontend:ci
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Smoke test image
        run: docker run --rm pulseboard-frontend:ci npx vite --version

      # The image actually used in production (Step 5a) - built separately so a
      # regression there is caught on the PR, not at the next real deploy. The
      # VITE_* values are placeholders: only build-time wiring is being checked here,
      # nothing here talks to a real backend.
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: false
          load: true
          tags: pulseboard-frontend:prod-ci
          build-args: |
            VITE_API_URL=https://ci.example.com
            VITE_REVERB_APP_KEY=ci-placeholder
            VITE_REVERB_HOST=ci.example.com
            VITE_REVERB_PORT=443
            VITE_REVERB_SCHEME=https
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod

      - name: Smoke test production image
        run: docker run --rm pulseboard-frontend:prod-ci nginx -t
